<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const isResizeObserverLoopMessage = (message) => (
        typeof message === 'string'
        && (
          message.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1
          || message.indexOf('ResizeObserver loop limit exceeded') !== -1
        )
      );

      const preventResizeObserverLoopError = (event) => {
        if (isResizeObserverLoopMessage(event.message)) {
          event.preventDefault();
        }
      };

      const preventResizeObserverLoopRejection = (event) => {
        const reason = event.reason && (event.reason.stack || event.reason.message || String(event.reason));
        if (isResizeObserverLoopMessage(reason)) {
          event.preventDefault();
        }
      };

      window.addEventListener('error', preventResizeObserverLoopError);
      window.addEventListener('unhandledrejection', preventResizeObserverLoopRejection);
    </script>
    <style>
      /* Critical pre-bundle shell: index.html owns this structure/style so the
         Tauri WebView can paint app chrome before the React chunk loads. */
      :root {
        color-scheme: light;
        background: #ffffff;
        color: #202020;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        background: #111111;
        color: #eeeeee;
      }
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
      }
      body {
        background: inherit;
        color: inherit;
        margin: 0;
        overflow: hidden;
      }
    </style>
    <title>Plumo</title>
  </head>
  <body>
    <script>
      (() => {
        var key = 'plumo:theme';
        var systemDarkQuery = '(prefers-color-scheme: dark)';
        function normalizeTheme(value) {
          return value === 'dark' || value === 'light' || value === 'system' ? value : null;
        }
        function prefersDarkTheme() {
          try {
            return typeof window.matchMedia === 'function' && window.matchMedia(systemDarkQuery).matches;
          } catch {
            return false;
          }
        }
        function resolveTheme(value) {
          var mode = normalizeTheme(value) || 'light';
          return mode === 'system' ? (prefersDarkTheme() ? 'dark' : 'light') : mode;
        }
        function applyTheme(value) {
          var mode = resolveTheme(value);
          document.documentElement.setAttribute('data-theme', mode);
        }
        var mode;
        try {
          applyTheme(normalizeTheme(localStorage.getItem(key)));
        } catch {
          applyTheme('light');
        }
        // The Primary color, when it is not the default: the style sheet the
        // app last laid over the page (src/shell/use-primary-color.ts).
        try {
          var primaryColorStyle = localStorage.getItem('plumo:primary-color-style');
          if (primaryColorStyle) {
            var style = document.createElement('style');
            style.id = 'plumo-primary-color';
            style.textContent = primaryColorStyle;
            document.head.appendChild(style);
          }
        } catch {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
