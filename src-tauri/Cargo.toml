[package]
name = "plumo"
version = "0.1.0-beta.1"
description = "A small desktop app for viewing and editing Markdown files"
authors = ["Plumo contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "plumo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
notify = "6.1"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
base64 = "0.22"
dirs = "5"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-prevent-default = "4.0.4"
trash = "5"
tauri-plugin-updater = "2"

[features]
# Dev-only opt-in: `cargo build --features devtools` (or `pnpm tauri dev -- --features devtools`)
# enables the WKWebView inspector. Release builds never enable it.
devtools = ["tauri/devtools"]

[dev-dependencies]
tempfile = "3"
